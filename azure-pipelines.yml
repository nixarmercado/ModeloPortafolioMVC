# ASP.NET Core (.NET 10) - Build and Deploy Pipeline
trigger:
  - main

pool:
  vmImage: 'windows-2022'

variables:
  proyecto: '**/*.csproj'
  buildConfiguration: 'Release'
  dotnetVersion: '10.0.x'

stages:
- stage: Build
  displayName: 'Compilación y Publicación'
  jobs:
  - job: BuildJob
    displayName: 'Compilar App'
    steps:

    # 1. Instalar el SDK de .NET 10
    - task: UseDotNet@2
      displayName: 'Instalar .NET SDK $(dotnetVersion)'
      inputs:
        packageType: 'sdk'
        version: '$(dotnetVersion)'

    # 2. Restaurar y Publicar la aplicación
    - task: DotNetCoreCLI@2
      displayName: 'Empaquetar la aplicación'
      inputs:
        command: 'publish'
        publishWebProjects: true
        projects: '$(proyecto)'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: true

    # 3. Guardar el artefacto zip para el despliegue
    - task: PublishBuildArtifacts@1
      displayName: 'Guardar artefacto'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

- stage: Deploy
  displayName: 'Despliegue a Azure App Service'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployJob
    displayName: 'Desplegar en Azure'
    steps:

    # 1. Descargar el archivo zip del stage de Build
    - task: DownloadBuildArtifacts@0
      displayName: 'Descargar artefacto'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'

    # 2. Publicar directamente en tu Azure App Service
    - task: AzureWebApp@1
      displayName: 'Subir a Azure App Service'
      inputs:
        azureSubscription: 'Azure-Portafolio' # Sustituye con el nombre de tu Service Connection
        appType: 'webApp'
        appName: 'PortafolioDevsNixar20261007010712'        # Sustituye con el nombre exacto de tu App Service en Azure
        package: '$(System.ArtifactsDirectory)/drop/*.zip'